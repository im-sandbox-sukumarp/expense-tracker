name: Publish Packages to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish NPM packages'
        type: boolean
        default: true
      publish_nuget:
        description: 'Publish NuGet packages'
        type: boolean
        default: true

jobs:
  publish-npm:
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@im-sandbox-sukumarp'

      - name: Build and publish expense-utils
        working-directory: packages/npm/expense-utils
        run: |
          npm install
          npm run build
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish expense-validators
        working-directory: packages/npm/expense-validators
        run: |
          npm install
          npm run build
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    if: ${{ inputs.publish_nuget }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username im-sandbox-sukumarp \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/im-sandbox-sukumarp/index.json"

      - name: Build and publish ExpenseTracker.Core
        working-directory: packages/nuget/ExpenseTracker.Core
        run: |
          dotnet build -c Release
          dotnet pack -c Release
          dotnet nuget push "bin/Release/*.nupkg" --source "github" --skip-duplicate

      - name: Build and publish ExpenseTracker.Services
        working-directory: packages/nuget/ExpenseTracker.Services
        run: |
          dotnet build -c Release
          dotnet pack -c Release
          dotnet nuget push "bin/Release/*.nupkg" --source "github" --skip-duplicate
